<!-- Sprite skin (assets/cat/cat.manifest.json "skin": "sprites"): frames laid out horizontally, one box width each. -->
@for (clip of spritePlays(); track clip) {
  <div class="sprite">
    <div
      class="sheet"
      [class.once]="!clip.loop"
      [style.width.%]="clip.frames * 100"
      [style.background-image]="clip.image"
      [style.animation-duration.ms]="clip.durationMs"
      [style.animation-timing-function]="sheetSteps(clip.frames)"
      [style.--n]="clip.frames"
    ></div>
  </div>
}
